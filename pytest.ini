[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --alluredir=reports/allure-results
    --screenshot=only-on-failure
    --tracing=retain-on-failure
markers =
    smoke: 冒烟用例
    zhiyan_smoke: 智言功能级只读冒烟（需显式启用）
    regression: 回归用例
    slow: 耗时用例
    b1_regression: B1保留样本的只读业务断言（需显式启用）
