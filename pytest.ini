[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --alluredir=reports/allure-results
    --screenshot=only-on-failure
    --tracing=retain-on-failure
markers =
    offline: 不访问站点的本地数据校验
    online: 三店在线 UI 用例（需 --run-online）
